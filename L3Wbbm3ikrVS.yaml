# Clash Verge Rev / Mihomo 多订阅合并基础配置
# 用途：本文件只负责汇总多个订阅节点。
# DNS、策略组、规则集和分流规则由你的“全局扩展脚本”统一覆盖，
# 因此这里故意不配置 dns、proxy-groups、rule-providers、rules 和 tun。

# 并允许并发建立 TCP 连接

tcp-concurrent: true

# 进程匹配
find-process-mode: strict

# 保存策略组选择与 Fake-IP 映射
profile:
  store-selected: true
  store-fake-ip: true

# ---------- 多机场节点集合 ----------
# 1. 本地机场：把机场提供的 YAML 文件放到 ./proxy_providers/local_airport.yaml。
# 2. 订阅机场：把 url 替换成机场提供的订阅链接。
# 3. 每个 provider 名称和 path 必须唯一。
# 4. additional-prefix 会给节点名称加来源前缀，避免不同机场出现同名节点。
proxy-providers:
  本地机场:
    type: file
    path: ./profiles/proxy_providers/Rnp3abiXaX5k.yaml
    override:
      additional-prefix: "[本地] "
# 检查节点：每30分钟
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      timeout: 5000
      lazy: true
      expected-status: 204

  订阅机场:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=c4084e75f95c2749ea10fc7181246368"
    path: ./profiles/proxy_providers/remote_airport1.yaml
    interval: 86400
    override:
      additional-prefix: "[订阅] "
# 检查节点：每5分钟
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      timeout: 5000
      lazy: true
      expected-status: 204

